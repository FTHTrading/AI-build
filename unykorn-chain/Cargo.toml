[package]
name = "unykorn-chain"
version = "1.0.0"
edition = "2021"
authors = ["Unykorn LLC <engineering@unykorn.com>"]

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"
tokio = { version = "1.36", features = ["full"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
