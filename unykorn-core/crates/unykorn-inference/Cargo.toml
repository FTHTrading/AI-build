[package]
name = "unykorn-inference"
version = "0.1.0"
edition = "2021"
authors = ["Unykorn LLC <engineering@unykorn.com>"]

[features]
default = []
cuda = ["candle-core/cuda"]

[dependencies]
candle-core = { version = "0.8" }
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
