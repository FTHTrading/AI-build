[package]
name = "unykorn-crypto"
version = "0.1.0"
edition = "2021"
authors = ["Unykorn LLC <engineering@unykorn.com>"]

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.5", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
